<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CropPulse - AI植物診断＆栽培日誌</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f0fdf4; color: #166534; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    header { border-bottom: 2px solid #bbf7d0; padding-bottom: 16px; margin-bottom: 24px; }
    .header-top { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.25rem; font-weight: 700; color: #15803d; }
    .btn { background: #16a34a; color: #ffffff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #15803d; }
    .btn-ai { background: #8b5cf6; color: #ffffff; }
    .btn-ai:hover { background: #7c3aed; }
    .btn-secondary { background: #e2e8f0; color: #475569; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-anon { background: #64748b; color: #ffffff; }
    .btn-danger { background: #ef4444; color: #ffffff; padding: 4px 10px; font-size: 0.75rem; border-radius: 6px; border: none; cursor: pointer; }
    .hidden { display: none !important; }
    .auth-buttons { display: flex; gap: 8px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 0.95rem; }
    .card { background: #f0fdf4; border: 1px solid #cbd5e1; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .card-title { font-weight: 700; color: #166534; }
    .user-box { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; background: #dcfce7; color: #15803d; font-weight: 600; }
    .ai-result-box { background: #f3e8ff; border: 1px solid #d8b4fe; border-radius: 8px; padding: 10px; margin-top: 8px; font-size: 0.85rem; color: #581c87; }
    .img-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 8px; object-fit: cover; }
    .card-img { width: 100%; max-height: 250px; border-radius: 8px; margin: 8px 0; object-fit: cover; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <h1>🌱 CropPulse AI</h1>
        <div id="auth-section">
          <div id="login-buttons" class="auth-buttons">
            <button id="google-login-btn" class="btn">Googleログイン</button>
            <button id="anon-login-btn" class="btn btn-anon">ゲストログイン</button>
          </div>
          <div id="user-info" class="user-box hidden">
            <span id="user-name" style="font-weight: 600; font-size: 0.875rem;"></span>
            <span id="user-type-badge" class="badge"></span>
            <button id="logout-btn" class="btn btn-secondary" style="margin-left: auto;">ログアウト</button>
          </div>
        </div>
      </div>
    </header>

    <!-- 入力フォーム -->
    <section id="form-section" class="hidden">
      <form id="crop-form">
        <div class="form-group">
          <label for="crop-name">作物名・品種</label>
          <input type="text" id="crop-name" placeholder="例: ミニトマト" required>
        </div>
        <div class="form-group">
          <label for="action-type">作業・状態</label>
          <select id="action-type" required>
            <option value="病気・症状の相談">病気・症状の相談 (AI診断)</option>
            <option value="水やり">水やり</option>
            <option value="追肥">追肥</option>
            <option value="収穫">収穫</option>
            <option value="観察記録">観察記録</option>
          </select>
        </div>
        <div class="form-group">
          <label for="photo-input">植物の写真（写真添付でAIが自動診断）</label>
          <input type="file" id="photo-input" accept="image/*">
          <img id="preview-img" class="img-preview hidden">
        </div>
        <div class="form-group">
          <label for="memo">メモ・気になる症状</label>
          <textarea id="memo" rows="3" placeholder="例: 葉っぱの先が黄色くなって枯れてきました。対策を教えてください。"></textarea>
        </div>
        <div style="display: flex; gap: 8px;">
          <button type="submit" class="btn" style="flex: 1;">記録を保存</button>
          <button type="button" id="ai-diagnose-btn" class="btn btn-ai">✨ AIで症状を診断</button>
        </div>
      </form>

      <!-- AI診断プレビュー表示エリア -->
      <div id="ai-status" class="ai-result-box hidden" style="margin-top: 16px;">
        <strong>🤖 AI診断結果:</strong>
        <p id="ai-output-text">診断中...</p>
      </div>

      <hr style="margin: 24px 0; border: none; border-top: 1px solid #e2e8f0;">
    </section>

    <!-- 一覧表示 -->
    <section>
      <h2 style="font-size: 1rem; margin-bottom: 12px;">栽培ログ＆AI診断履歴</h2>
      <div id="logs-list">
        <p style="text-align: center; color: #94a3b8; padding: 24px 0;">ログインすると栽培記録の閲覧・登録ができます。</p>
      </div>
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, signInAnonymously, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ★ ご自身の API キーに書き換えてください（無料取得可）
    const GEMINI_API_KEY = "AQ.Ab8RN6Lz9lTRoVq5DK3bidlkwREfUSE5HrFfnqqU_QNdc0fYnA";

    const firebaseConfig = {
      apiKey: "AIzaSyAO4mkYVhTktpK3Up0E0o4p_57L5fwuNdQ",
      authDomain: "croppulse-806e9.firebaseapp.com",
      projectId: "croppulse-806e9",
      storageBucket: "croppulse-806e9.firebasestorage.app",
      messagingSenderId: "276931504826",
      appId: "1:276931504826:web:be2a1db9f5227e1902f083"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let unsubscribeSnapshot = null;
    let currentBase64Image = "";
    let currentAiDiagnosis = "";

    // 画像プレビュー処理
    document.getElementById("photo-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        currentBase64Image = event.target.result;
        const imgEl = document.getElementById("preview-img");
        imgEl.src = currentBase64Image;
        imgEl.classList.remove("hidden");
      };
      reader.readAsDataURL(file);
    });

    // Gemini API 呼び出し関数
    async function diagnoseWithGemini() {
      const cropName = document.getElementById("crop-name").value || "植物";
      const memo = document.getElementById("memo").value || "状態を診断してください。";
      const aiStatusEl = document.getElementById("ai-status");
      const aiOutputEl = document.getElementById("ai-output-text");

      aiStatusEl.classList.remove("hidden");
      aiOutputEl.textContent = "AIが植物の状態を分析中...";

      try {
        let contents = [];
        let promptText = `あなたは農業と植物栽培のプロです。初心者向けに分かりやすく短くアドバイスしてください。\n対象の作物: ${cropName}\n観察メモ: ${memo}\n\n回答フォーマット:\n【可能性のある状態・病気】\n【対策とおすすめのケア】`;

        if (currentBase64Image) {
          const base64Data = currentBase64Image.split(",")[1];
          const mimeType = currentBase64Image.split(";")[0].split(":")[1];
          contents = [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: mimeType, data: base64Data } }
            ]
          }];
        } else {
          contents = [{ parts: [{ text: promptText }] }];
        }

        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents })
        });

        const data = await response.json();
        currentAiDiagnosis = data.candidates[0].content.parts[0].text;
        aiOutputEl.innerHTML = currentAiDiagnosis.replace(/\n/g, "<br>");
      } catch (err) {
        currentAiDiagnosis = "AI診断に失敗しました。画像や入力内容を確認してください。";
        aiOutputEl.textContent = currentAiDiagnosis;
      }
    }

    document.getElementById("ai-diagnose-btn").addEventListener("click", diagnoseWithGemini);

    // ログイン関係
    document.getElementById("google-login-btn").addEventListener("click", () => signInWithPopup(auth, provider));
    document.getElementById("anon-login-btn").addEventListener("click", () => signInAnonymously(auth));
    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      const loginButtons = document.getElementById("login-buttons");
      const userInfo = document.getElementById("user-info");
      const formSection = document.getElementById("form-section");

      if (user) {
        loginButtons.classList.add("hidden");
        userInfo.classList.remove("hidden");
        formSection.classList.remove("hidden");
        document.getElementById("user-name").textContent = user.isAnonymous ? "ゲスト" : (user.displayName || "Googleユーザー");
        document.getElementById("user-type-badge").textContent = user.isAnonymous ? "匿名" : "認証済";
        loadLogs();
      } else {
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        loginButtons.classList.remove("hidden");
        userInfo.classList.add("hidden");
        formSection.classList.add("hidden");
        document.getElementById("logs-list").innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 24px 0;">ログインすると栽培記録の閲覧・登録ができます。</p>';
      }
    });

    // データ保存
    document.getElementById("crop-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const displayName = currentUser.isAnonymous ? "ゲスト" : (currentUser.displayName || "Googleユーザー");

      try {
        await addDoc(collection(db, "crop_logs"), {
          cropName: document.getElementById("crop-name").value,
          actionType: document.getElementById("action-type").value,
          memo: document.getElementById("memo").value,
          imageUrl: currentBase64Image || "",
          aiDiagnosis: currentAiDiagnosis || "",
          userName: displayName,
          userId: currentUser.uid,
          createdAt: serverTimestamp()
        });

        // フォームリセット
        document.getElementById("crop-form").reset();
        document.getElementById("preview-img").classList.add("hidden");
        document.getElementById("ai-status").classList.add("hidden");
        currentBase64Image = "";
        currentAiDiagnosis = "";
      } catch (err) {
        alert("保存エラー: " + err.message);
      }
    });

    // 削除処理
    window.deleteLog = async (docId) => {
      if (!confirm("この記録を削除しますか？")) return;
      try {
        await deleteDoc(doc(db, "crop_logs", docId));
      } catch (err) {
        alert("削除エラー: " + err.message);
      }
    };

    // リアルタイム表示
    function loadLogs() {
      if (!currentUser) return;
      const q = query(collection(db, "crop_logs"));
      if (unsubscribeSnapshot) unsubscribeSnapshot();

      unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
        const listEl = document.getElementById("logs-list");
        listEl.innerHTML = "";

        if (snapshot.empty) {
          listEl.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 24px 0;">記録はまだありません。</p>';
          return;
        }

        const docsArray = [];
        snapshot.forEach((docItem) => docsArray.push({ id: docItem.id, data: docItem.data() }));

        docsArray.sort((a, b) => {
          const timeA = a.data.createdAt ? a.data.createdAt.toMillis() : Date.now();
          const timeB = b.data.createdAt ? b.data.createdAt.toMillis() : Date.now();
          return timeB - timeA;
        });

        docsArray.forEach((item) => {
          const log = item.data;
          const isMyPost = currentUser && log.userId === currentUser.uid;

          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="card-header">
              <div>
                <div class="card-title">${log.cropName}（${log.actionType}）</div>
                <div style="font-size: 0.75rem; color: #64748b;">記録者: ${log.userName}</div>
              </div>
              ${isMyPost ? `<button class="btn btn-danger" onclick="deleteLog('${item.id}')">削除</button>` : ''}
            </div>
            ${log.imageUrl ? `<img src="${log.imageUrl}" class="card-img">` : ''}
            <div style="font-size: 0.875rem; color: #334155; margin-top: 4px;">${log.memo || 'メモなし'}</div>
            ${log.aiDiagnosis ? `<div class="ai-result-box"><strong>🤖 AIのアドバイス:</strong><br>${log.aiDiagnosis.replace(/\n/g, "<br>")}</div>` : ''}
          `;
          listEl.appendChild(card);
        });
      });
    }
  </script>
</body>
</html>
